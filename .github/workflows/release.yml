name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

# A release on main back-merges into dev, so never run two releases at once.
concurrency:
  group: release
  cancel-in-progress: false

# Secrets required (set in repo settings):
#   KEYSTORE_BASE64  - base64-encoded release.jks
#   KEYSTORE_PASS    - keystore password
#   KEY_ALIAS        - key alias
#   KEY_PASS         - key password
#   AGENT_BUNDLE_KEY        - PEM private key that signs the agent bundle (required; releases fail without it)
#   AGENT_BUNDLE_PUBLIC_KEY - base64 DER public key the app verifies bundles with (required; must be the public half of AGENT_BUNDLE_KEY)
#                             Both are made together by .github/scripts/generate-bundle-key.sh.

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # semantic-release searches and closes its own failure issues, and labels released ones.
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # An unsigned bundle is useless to the app (it refuses to install one over the air), and a release built without
      # the public key can never verify later bundles. Fail now, before anything is built or published.
      - name: Check bundle signing secrets
        env:
          AGENT_BUNDLE_KEY: ${{ secrets.AGENT_BUNDLE_KEY }}
          AGENT_BUNDLE_PUBLIC_KEY: ${{ secrets.AGENT_BUNDLE_PUBLIC_KEY }}
        run: .github/scripts/check-bundle-keys.sh

      - name: Setup Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      # bundleAgent runs `bun install` from the committed lockfile on every build; keep Bun's downloads between runs.
      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('app/agent-build/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
          {
            echo "storeFile=app/release.jks"
            echo "storePassword=$KEYSTORE_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > keystore.properties

      # Builds and verifies the APK in prepareCmd, then publishes the GitHub release.
      - name: Release
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_BUNDLE_KEY: ${{ secrets.AGENT_BUNDLE_KEY }}
          AGENT_BUNDLE_PUBLIC_KEY: ${{ secrets.AGENT_BUNDLE_PUBLIC_KEY }}
