<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Flappy</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    touch-action:manipulation;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;image-rendering:pixelated}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(() => {
  "use strict";
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");

  // ---- canvas sizing (fit a fixed virtual world into the window) -------------
  const W = 360, H = 640;          // logical size, always the same
  let scale = 1, cssW = W, cssH = H;
  function resize() {
    const vw = window.innerWidth || 360, vh = window.innerHeight || 640;
    scale = Math.max(vw / W, vh / H);      // cover: no letterbox bars
    cssW = Math.max(1, Math.round(W * scale)); cssH = Math.max(1, Math.round(H * scale));
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    cv.width = Math.max(1, Math.round(cssW * dpr)); cv.height = Math.max(1, Math.round(cssH * dpr));
    cv.style.width = cssW + "px"; cv.style.height = cssH + "px";
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  }
  addEventListener("resize", resize, { passive: true });
  addEventListener("orientationchange", resize, { passive: true });
  resize();

  // ---- tuning ---------------------------------------------------------------
  const GRAVITY   = 1500;   // px/s^2
  const FLAP_V    = -430;   // px/s on tap
  const MAX_FALL  = 620;
  const GROUND_H  = 64;
  const PIPE_W    = 62;
  const PIPE_GAP  = 152;   // vertical opening
  const PIPE_GAP_MIN = 122;
  const PIPE_SPACE = 150; // horizontal space between neighbouring pipes
  const PIPE_SPACE_MIN = 118;
  const SPEED     = 150;    // px/s scroll
  const START_GAP = 200;    // first gap centre offset from left edge

  // ---- state ----------------------------------------------------------------
  let bird, pipes, score, best, state, tPrev, flash, deadFor, debug;

  const nowMs = () => (typeof performance === "object" && performance && performance.now
    ? performance.now() : Date.now());

  best = 0;
  try { best = parseInt(localStorage.getItem("flappy.best") || "0", 10) || 0; } catch (e) {}

  function newBird() {
    return { x: 92, y: H * 0.32, v: 0, r: 11, rot: 0, wing: 0 };
  }
  function reset() {
    bird = newBird();
    pipes = [];
    score = 0;
    state = "ready";          // ready | play | dead
    deadFor = 0;
    flash = 0;
  }
  reset();

  function flap() {
    if (state === "ready") { state = "play"; bird.v = FLAP_V; return; }
    if (state === "dead")  { if (deadFor > 0.45) reset(); return; }
    bird.v = FLAP_V;
    bird.rot = -0.45;
  }

  // input -- every handler funnels through tap() which de-duplicates, because some
  // WebViews fire pointerdown *and* touchstart for one finger and the bird would
  // otherwise be launched twice per tap.
  let lastTap = -1e9;
  function tap() {
    const now = nowMs();
    if (now - lastTap < 40) return;      // same physical tap, second event
    lastTap = now;
    flap();
  }
  addEventListener("keydown", e => {
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "Enter" || e.code === "KeyW") {
      e.preventDefault(); tap();
    }
    if (e.code === "KeyR") { reset(); }
    if (e.code === "KeyD") { debug = !debug; }
  });
  const pointerOK = typeof window.PointerEvent === "function";
  const events = pointerOK ? ["pointerdown"] : ["touchstart", "mousedown", "click"];
  for (const ev of events) {
    addEventListener(ev, e => { if (e.cancelable) e.preventDefault(); tap(); }, { passive: false });
    document.addEventListener(ev, e => { if (e.cancelable) e.preventDefault(); }, { passive: false });
  }
  addEventListener("contextmenu", e => e.preventDefault());

  // ---- update ---------------------------------------------------------------
  function update(dt) {
    tPrev = (tPrev || 0) + dt;
    flash = Math.max(0, flash - dt);

    if (state === "play") {
      bird.v = Math.min(bird.v + GRAVITY * dt, MAX_FALL);
      bird.y += bird.v * dt;
      bird.wing += dt * 14;

      // Spawn the next pipe only once the previous one has moved far enough left
      // that there is real horizontal space between them. Keyed off the right
      // EDGE of the last pipe, otherwise pipes spawn while still on screen and
      // end up touching.
      const spacing = Math.max(PIPE_SPACE_MIN, PIPE_SPACE - score * 1.1);
      const lastPipe = pipes[pipes.length - 1];
      if (!lastPipe || lastPipe.x + PIPE_W + spacing <= W + 10) {
        const span = (H - GROUND_H) - PIPE_GAP;
        const top = Math.random() * Math.max(1, span - 60) + 20;
        pipes.push({ x: W + 10, top, gap: Math.max(PIPE_GAP_MIN, PIPE_GAP - score * 1.2), scored: false });
      }
      for (const p of pipes) {
        p.x -= SPEED * dt;
        if (!p.scored && p.x + PIPE_W < bird.r) { p.scored = true; score++; flash = 0.16; }
      }
      while (pipes.length && pipes[0].x + PIPE_W < -10) pipes.shift();

      // rotation eases toward velocity
      bird.rot += (Math.min(bird.v / 620, 1) * 1.1 - bird.rot) * Math.min(1, dt * 8);

      // death
      const floor = H - GROUND_H - bird.r;
      if (bird.y + bird.r >= H - GROUND_H) {
        bird.y = H - GROUND_H - bird.r; die();
      } else if (bird.y - bird.r <= 0) {
        bird.y = bird.r; bird.v = 0;               // bonk the ceiling, keep going
      } else {
        for (const p of pipes) {
          const inX = bird.x + bird.r * 0.8 > p.x && bird.x - bird.r * 0.8 < p.x + PIPE_W;
          if (!inX) continue;
          // Die only if the bird pokes into a pipe BODY: above the opening's
          // ceiling or below its floor. Inside the opening is safe.
          if (bird.y - bird.r < p.top || bird.y + bird.r > p.top + p.gap) { die(); break; }
        }
      }
    } else if (state === "dead") {
      deadFor += dt;
      bird.v = Math.min(bird.v + GRAVITY * dt, MAX_FALL);
      bird.y = Math.min(bird.y + bird.v * dt, H - GROUND_H - bird.r);
      bird.rot = Math.min(bird.rot + dt * 6, Math.PI / 2);
      if (deadFor > 0.45) { bird.y = H - GROUND_H - bird.r; bird.v = 0; }
    } else {
      // ready: gentle hover bob
      bird.wing += dt * 10;
      bird.y = H * 0.32 + Math.sin(tPrev * 3) * 6;
      bird.rot = -0.12;
    }
  }

  function die() {
    if (state === "dead") return;
    state = "dead";
    deadFor = 0;
    bird.v = 0;
    if (score > best) { best = score; try { localStorage.setItem("flappy.best", String(best)); } catch (e) {} }
  }

  // ---- draw -----------------------------------------------------------------
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    const rad = Math.min(r, w / 2, h / 2);
    ctx.moveTo(x + rad, y);
    ctx.arcTo(x + w, y, x + w, y + h, rad);
    ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad);
    ctx.arcTo(x, y, x + w, y, rad);
    ctx.closePath();
  }

  function drawPipe(p) {
    const x = p.x, botY = p.top + p.gap;
    // top pipe (hangs from ceiling)
    grad(x, 0, PIPE_W, p.top);
    rr(x, 0, PIPE_W, p.top, 4); ctx.fill();
    ctx.fillStyle = "#3fd45a"; ctx.fillRect(x + 6, 0, 8, p.top);
    ctx.fillStyle = "#0d3a1c"; ctx.fillRect(x + PIPE_W - 7, 0, 5, p.top);
    rr(x - 5, p.top - 26, PIPE_W + 10, 26, 4); ctx.fillStyle = "#2fbe4a"; ctx.fill();
    ctx.fillStyle = "#5ef06e"; ctx.fillRect(x + 1, p.top - 26, PIPE_W + 10, 5);
    ctx.fillStyle = "#14682a"; ctx.fillRect(x + 1, p.top - 5, PIPE_W + 10, 5);
    // bottom pipe
    grad(x, botY, PIPE_W, H - GROUND_H - botY);
    rr(x, botY, PIPE_W, H - GROUND_H - botY, 4); ctx.fill();
    ctx.fillStyle = "#3fd45a"; ctx.fillRect(x + 6, botY, 8, H - GROUND_H - botY);
    ctx.fillStyle = "#0d3a1c"; ctx.fillRect(x + PIPE_W - 7, botY, 5, H - GROUND_H - botY);
    rr(x - 5, botY, PIPE_W + 10, 26, 4); ctx.fillStyle = "#2fbe4a"; ctx.fill();
    ctx.fillStyle = "#5ef06e"; ctx.fillRect(x + 1, botY, PIPE_W + 10, 5);
    ctx.fillStyle = "#14682a"; ctx.fillRect(x + 1, botY + 21, PIPE_W + 10, 5);
  }
  function grad(x, y, w, h) {
    if (!isFinite(x) || !isFinite(y) || !isFinite(w)) throw new Error("grad(): non-finite " + [x, y, w]);
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, "#2fbe4a"); g.addColorStop(0.4, "#63ef74");
    g.addColorStop(1, "#2fbe4a"); ctx.fillStyle = g;
  }

  function drawGround() {
    const y = H - GROUND_H;
    ctx.fillStyle = "#c8e9a0"; ctx.fillRect(0, y - 4, W, 4);
    ctx.fillStyle = "#8fd451"; ctx.fillRect(0, y, W, 4);
    ctx.fillStyle = "#d6c68a"; ctx.fillRect(0, y + 4, W, GROUND_H - 4);
    ctx.fillStyle = "#c2b075";
    const off = (tPrev * SPEED) % 24;
    for (let x = -off; x < W; x += 24) {
      ctx.beginPath();
      ctx.moveTo(x, y + 4); ctx.lineTo(x + 12, y + 4);
      ctx.lineTo(x + 12 + 6, H); ctx.lineTo(x + 6, H);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = "#a8935f"; ctx.fillRect(0, H - 3, W, 3);
  }

  function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rot);
    const flapUp = Math.sin(bird.wing) > 0;

    // body
    ctx.fillStyle = "#ffe14d";
    ctx.beginPath(); ctx.ellipse(0, 0, bird.r + 3, bird.r, 0, 0, 7); ctx.fill();
    // wing
    ctx.fillStyle = "#f5c518";
    ctx.beginPath();
    const wy = flapUp ? 1 : 5;
    ctx.ellipse(-3, wy, 9, 5.5, flapUp ? 0.5 : -0.5, 0, 7);
    ctx.fill();
    // tail
    ctx.fillStyle = "#f0b400";
    ctx.beginPath();
    ctx.moveTo(-9, -3); ctx.lineTo(-20, -8); ctx.lineTo(-17, 0); ctx.lineTo(-20, 8);
    ctx.closePath(); ctx.fill();
    // beak
    ctx.fillStyle = "#ff8a1f";
    ctx.beginPath();
    ctx.moveTo(9, -1); ctx.lineTo(21, 2); ctx.lineTo(9, 6); ctx.closePath(); ctx.fill();
    // eye
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(5, -4, 5.4, 0, 7); ctx.fill();
    ctx.fillStyle = "#111";
    const look = state === "dead" ? -1 : 2;
    ctx.beginPath(); ctx.arc(6.5, -3 + look * 0.4, 2.3, 0, 7); ctx.fill();
    ctx.restore();
  }

  function text(str, y, size, color, weight, shadow) {
    ctx.font = (weight || 700) + " " + size + "px system-ui,-apple-system,Segoe UI,Roboto,sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    if (shadow !== false) {
      ctx.fillStyle = "rgba(0,0,0,.45)";
      ctx.fillText(str, W / 2 + 2, y + 2);
    }
    ctx.fillStyle = color;
    ctx.fillText(str, W / 2, y);
  }

  function drawOverlay() {
    // dim
    ctx.fillStyle = "rgba(0,0,0,.35)";
    ctx.fillRect(0, 0, W, H);

    const panelW = 268, panelH = 150, px = (W - panelW) / 2, py = H * 0.3;
    ctx.fillStyle = "rgba(20,20,26,.92)";
    rr(px, py, panelW, panelH, 14); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.14)"; ctx.lineWidth = 2;
    rr(px, py, panelW, panelH, 14); ctx.stroke();

    if (state === "ready") {
      text("FLAPPY", py + 40, 34, "#ffe14d");
      text("tap / space to flap", py + 76, 15, "#cfe8ff");
      text("best " + best, py + 100, 15, "#8fb8d8");
      const b = 0.6 + 0.4 * Math.sin(tPrev * 5);
      ctx.globalAlpha = b;
      text("click to start", py + 128, 17, "#ffffff");
      ctx.globalAlpha = 1;
    } else if (state === "dead") {
      text("GAME OVER", py + 40, 28, "#ff5a5a");
      text("score " + score, py + 76, 18, "#ffffff");
      text("best " + best, py + 100, 15, "#8fb8d8");
      if (deadFor > 0.45) {
        const b = 0.55 + 0.45 * Math.sin(tPrev * 5);
        ctx.globalAlpha = b;
        text("tap to retry", py + 128, 17, "#ffffff");
        ctx.globalAlpha = 1;
      }
    }
  }

  function draw() {
    // sky
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#4ec0ee"); sky.addColorStop(0.55, "#8fe0f5"); sky.addColorStop(1, "#d8f3c4");
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

    // parallax clouds
    ctx.fillStyle = "rgba(255,255,255,.75)";
    const clouds = [[40, 90, 0.25], [190, 60, 0.4], [300, 150, 0.2], [120, 210, 0.15], [250, 300, 0.12]];
    for (let i = 0; i < clouds.length; i++) {
      const [cx, cy, sp] = clouds[i];
      const x = ((cx - tPrev * SPEED * sp) % (W + 140) + W + 140) % (W + 140) - 70;
      const s = 1 + sp * 2;
      ctx.beginPath();
      ctx.arc(x, cy, 16 * s, 0, 7);
      ctx.arc(x + 18 * s, cy - 8 * s, 13 * s, 0, 7);
      ctx.arc(x + 34 * s, cy + 1 * s, 15 * s, 0, 7);
      ctx.fill();
    }

    for (const p of pipes) drawPipe(p);
    drawGround();
    drawBird();

    if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * 0.9})`; ctx.fillRect(0, 0, W, H); }

    if (state === "play" || state === "dead") {
      text(String(score), H * 0.14, 44, "#ffffff", 800);
    }
    if (state !== "play") drawOverlay();

    if (debug) {
      ctx.font = "11px monospace"; ctx.textAlign = "left"; ctx.textBaseline = "top";
      ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(0, 0, W, 42);
      ctx.fillStyle = "#7CFFB2";
      ctx.fillText("fps " + fps + "   state " + state + "   score " + score + "   y " + Math.round(bird.y), 5, 3);
      ctx.fillText("canvas " + cv.width + "x" + cv.height + "   clock " + (rafId != null ? "raf+timer" : "timer") +
        (fatal ? "   ERROR" : ""), 5, 17);
      ctx.fillText("tap or space = flap   D = this box   R = reset", 5, 31);
    }
  }

  // ---- loop -----------------------------------------------------------------
  // Some embedded WebViews throttle requestAnimationFrame to a standstill (hidden
  // page, no hardware acceleration, battery saver), which looks exactly like a
  // frozen game. So the clock is driven by rAF *and* a timer; whichever is starving
  // takes over. And a thrown error is painted on the canvas instead of leaving a
  // frozen frame -- press D to see this box.
  bird.x = 92;
  let last = nowMs(), rafId = null, timerId = null, fatal = null;
  let fps = 0, frameCount = 0, fpsAt = last, lastRafAt = -1e9, total = 0;

  function showError(err) {
    try {
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = "rgba(0,0,0,.93)";
      ctx.fillRect(0, 0, cv.width, cv.height);
      const fs = Math.max(9, Math.round(cv.width / 26));
      ctx.font = "600 " + fs + "px monospace";
      ctx.textAlign = "left"; ctx.textBaseline = "top";
      ctx.fillStyle = "#ff7a7a"; ctx.fillText("Flappy hit an error:", 10, 10);
      ctx.fillStyle = "#ffffff";
      String((err && err.stack) || err).split("\n").slice(0, 14)
        .forEach((line, i) => ctx.fillText(line, 10, 10 + fs * 1.5 * (i + 1)));
      ctx.restore();
    } catch (e) { /* nothing more we can do */ }
  }

  function tick(now) {
    if (typeof now !== "number" || !isFinite(now)) now = nowMs();
    let dt = (now - last) / 1000;
    if (!(dt > 0)) return;                 // duplicate tick from the other clock
    last = now;
    if (dt > 0.05) dt = 0.05;              // clamp after a tab switch
    frameCount++; total++;
    if (now - fpsAt >= 500) { fps = Math.round(frameCount * 1000 / (now - fpsAt)); frameCount = 0; fpsAt = now; }
    if (fatal) return;
    try { update(dt); draw(); }
    catch (err) { fatal = err; if (window.console) console.error(err); showError(err); }
  }

  function pump(now) { lastRafAt = now; tick(now); rafId = requestAnimationFrame(pump); }
  function pumpTimer() {
    const now = nowMs();
    // If rAF is alive, stay out of its way (big threshold = no double-stepping).
    // If it has gone quiet for half a second, the timer drives at full speed.
    const need = (now - lastRafAt < 500) ? 45 : 12;
    if (now - last >= need) tick(now);
    timerId = setTimeout(pumpTimer, 16);
  }

  addEventListener("visibilitychange", () => { last = nowMs(); fpsAt = last; frameCount = 0; });
  if (window.requestAnimationFrame) rafId = requestAnimationFrame(pump);
  timerId = setTimeout(pumpTimer, 16);

  // If nothing at all got painted, say so on the canvas instead of showing a
  // dead black rectangle -- usually means the file was opened in a viewer that
  // does not run JavaScript.
  setTimeout(() => {
    if (total > 0 || fatal) return;
    showError("Nothing is being drawn.\n\nThe page is alive but the canvas is not\npainting, or JavaScript is blocked.\n\nTry opening this file in Chrome\n(Google) rather than a file viewer.");
  }, 2500);

  // small hook for debugging from a console / automation
  window.flappy = {
    flap: () => flap(), reset: () => reset(),
    get state() { return state; }, get score() { return score; }, get best() { return best; },
    get fps() { return fps; }, get error() { return fatal ? String((fatal && fatal.stack) || fatal) : null; },
    get frames() { return total; },
    get pipes() { return pipes.map(p => ({ x: p.x, top: p.top, gap: p.gap })); },
    get bird() { return bird; },
  };
})();
</script>
</body>
</html>
